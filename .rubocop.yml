# frozen_string_literal: true

# RuboCop configuration for Prescient gem
# Modern Ruby best practices with sensible defaults

plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rake

AllCops:
  # Target Ruby 3.1+ (matches gemspec requirement)
  TargetRubyVersion: 3.1
  # Use new cops by default
  NewCops: enable
  # Exclude common directories
  Exclude:
    - 'vendor/**/*'
    - 'bin/*'
    - 'tmp/**/*'
    - 'coverage/**/*'
    - 'pkg/**/*'
    - '*.gemspec'
    - 'Gemfile'
    - 'Rakefile'
    - 'examples/**/*'

Metrics/ParameterLists:
  CountKeywordArgs: false

Layout/LineLength:
  Max: 120
  Exclude:
    - 'test/**/*'
    - 'lib/prescient.rb'  # Configuration can have long lines
  AllowedPatterns:
    - '^\s*#'  # Comments
    - '^\s*it\s'  # Test descriptions
    - '^\s*context\s'  # Test contexts
    - '^\s*describe\s'  # Test descriptions

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Metrics/ClassLength:
  Enabled: true
  Max: 145
  Exclude:
    - 'test/**/*'

Metrics/MethodLength:
  Max: 37
  Exclude:
    - "test/**/*"
    - "db/migrate/**/*"

Metrics/AbcSize:
  Enabled: true
  Max: 55
  Exclude:
    - "test/**/*"
    - "db/migrate/**/*"

Minitest/MultipleAssertions:
  Max: 20

Metrics/PerceivedComplexity:
  Max: 10

Metrics/BlockLength:
  Max: 35


Metrics/CyclomaticComplexity:
  Max: 10
